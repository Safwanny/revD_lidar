# Mapping routes for slam_eval, in the world frame (m). spawn is x, y, yaw for
# simulation.launch.py; waypoints are visited in order, straight lines through
# doorway centres, every room entered and the start revisited to close loops.
navigation_basic:
  spawn: [0.0, 0.0, 0.0]
  waypoints:
    - [0.0, -3.0]
    - [4.0, -3.2]
    - [4.0, 3.3]
    - [1.5, 3.5]
    - [-4.0, 3.2]
    - [-4.0, -3.0]
    - [-1.5, -3.0]
    - [0.0, 0.0]
    - [0.5, 2.5]
    - [-0.5, 1.0]
    - [0.0, 0.0]
